spring.application.name=QuanLyTuyenDung
server.port=8080

spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# REST API Configuration
spring.mvc.format.date=yyyy-MM-dd

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/quanlytuyendung?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Mhung3895@gmail.com
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Cấu hình Multipart Upload CV (hỗ trợ tối đa 15MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Google Gemini API Key
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-1.5-flash

# ========================================================
# Cấu hình Spring Boot Mail (Hỗ trợ gửi email tự động)
# ========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Cấu hình tài khoản email hệ thống (nếu dùng thực tế, điền email và Mật khẩu ứng dụng 16 ký tự của Gmail)
spring.mail.username=${SPRING_MAIL_USERNAME:recruitment@techcorp.vn}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000